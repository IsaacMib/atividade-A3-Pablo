{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
 <div class="rich-text-page--wrapper">
  <div class="container">
    <div class="row">
      <div class="col-12">
        <article class="rich-text-page">
          <h1 class="titulo-noticia">{{ page.title }}</h1>
          
          {% if page.body %}
            <div class="rich-text-content">
              {% include_block page.body %}
            </div>
          {% endif %}
          
        </article>
      </div>
    </div>
  </div>
</div>
{% endblock %}
