<!-- Serviços Online Card -->
<div class="row gap-4">
{% for i in '12345678' %} <!-- Para simular múltiplos cards -->
<div class="card shadow-sm h-100" style="max-width: 350px; transition: all 0.1s ease-in;">
    <div class="card-header d-flex align-items-center justify-content-between text-white" 
         style="background: linear-gradient(302.81deg, #1a3155 -105%, #396bbb 146.81%); min-height: 2.5rem; padding: 8px 12px;">
        <span class="fw-bold">DETRAN - Habilitação</span>
        <div class="d-flex gap-2">
            <span class="d-inline-flex align-items-center justify-content-center rounded-circle border border-white p-1" 
                  style="width: 28px; height: 28px; cursor: pointer;" 
                  data-bs-toggle="tooltip" 
                  data-bs-placement="top" 
                  title="Presencial">
                <i class="pi pi-user" style="font-size: 0.8rem;"></i>
            </span>
            <span class="d-inline-flex align-items-center justify-content-center rounded-circle border border-white p-1" 
                  style="width: 28px; height: 28px; cursor: pointer;" 
                  data-bs-toggle="tooltip" 
                  data-bs-placement="top" 
                  title="Serviço para tirar habilitação">
                <i class="pi pi-question" style="font-size: 0.8rem;"></i>
            </span>
        </div>
    </div>
    <div class="card-body d-flex justify-content-center align-items-center">
        <h5 class="card-title m-0 text-center text-muted fw-semibold fs-5" 
            style="word-break: break-word;">
            Habilitação
        </h5>
    </div>
    <div class="card-footer bg-transparent border-top">
        <button class="btn btn-outline-secondary rounded-pill px-4 py-2 fw-semibold"
                style="border-color: #666b72; color: #666b72;"
                onmouseover="this.style.backgroundColor='#666b72'; this.style.color='white';"
                onmouseout="this.style.backgroundColor='transparent'; this.style.color='#666b72';"
                onclick="handleClick('123')">
            Acessar
        </button>
    </div>
</div>
{% endfor %}
</div>
<!-- Initialize Bootstrap tooltips -->
<script>
    var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
    var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl);
    });
</script>
