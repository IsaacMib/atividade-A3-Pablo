<header class="bg-white shadow-sm">
    <nav class="container mx-auto px-4 py-4">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-8">
                <a href="{% url 'estoque:dashboard' %}" class="text-xl font-bold text-primary-600">
                    Gestão de Estoque
                </a>
                
                <div class="hidden md:flex space-x-4">
                    <a href="{% url 'estoque:dashboard' %}" class="text-gray-700 hover:text-primary-600 transition">
                        Início
                    </a>
                    <a href="#" class="text-gray-700 hover:text-primary-600 transition">
                        Produtos
                    </a>
                    <a href="#" class="text-gray-700 hover:text-primary-600 transition">
                        Categorias
                    </a>
                    <a href="#" class="text-gray-700 hover:text-primary-600 transition">
                        Relatórios
                    </a>
                </div>
            </div>
            
            <div class="flex items-center space-x-4">
                {% if user.is_authenticated %}
                    <span class="text-gray-700">Olá, {{ user.get_full_name|default:user.username }}</span>
                    <a href="{% url 'admin:index' %}" class="btn btn-secondary">Admin</a>
                    <a href="{% url 'admin:logout' %}" class="btn btn-primary">Sair</a>
                {% else %}
                    <a href="{% url 'admin:login' %}" class="btn btn-primary">Entrar</a>
                {% endif %}
            </div>
        </div>
    </nav>
</header>
