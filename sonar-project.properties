# Configurações Python
sonar.python.version=3.14
sonar.python.xunit.reportPath=test-report.xml
sonar.python.coverage.reportPaths=coverage.xml

# Configurações JavaScript
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.eslint.reportPaths=eslint-report.json

# Exclusões de cobertura
sonar.coverage.exclusions=manage.py,_conf/*,_core/*,*/admin.py,*/apps.py,*/migrations/*,*/tests.py,*/tests/*,frontend/js/vendor/*,node_modules/*,webpack.config.js,postcss.config.mjs

# Exclusões de análise
sonar.exclusions=node_modules/**/*,frontend/bundles/**/*,frontend/img/**/*,frontend/sprite/**/*,frontend/sprites-img/**/*,static/**/*,staticfiles/**/*,__pycache__/**/*,*.pyc,db.sqlite3,webpack-stats.json

# Configurações de qualidade de código
sonar.sources=.
sonar.sourceEncoding=UTF-8

# Desabilitar análise de duplicação para arquivos de migração
sonar.cpd.exclusions=*/migrations/*
