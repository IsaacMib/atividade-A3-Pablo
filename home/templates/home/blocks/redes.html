{% load static %}
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Redes Sociais</title>

  <!-- Bootstrap + Ícones -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">

  <style>
    .social-banner {
      background-color: #fff;
      padding: 40px 20px;
    }

    .social-image {
      max-width: 400px;
      height: auto;
    }

    .social-icons a {
      font-size: 1.8rem;
      margin: 0 12px;
      color: #0d6efd; /* Azul padrão Bootstrap */
      transition: transform 0.2s ease-in-out;
    }

    .social-icons a:hover {
      transform: scale(1.2);
    }

    .social-text h5 {
      font-size: 1.5rem;
      font-weight: bold;
      color: #0d6efd;
    }
  </style>
</head>
<body>

  <section class="social-banner">
    <div class="container">
      <div class="row align-items-center justify-content-center text-center text-md-start">

        <!-- Coluna da imagem -->
        <div class="col-12 col-md-6 mb-4 mb-md-0 text-center">
          <img src="{% static 'img/rede.png' %}" alt="Redes sociais" class="social-image" />
        </div>

        <!-- Coluna do texto + ícones -->
        <div class="col-12 col-md-6 social-text">
          <h5 class="mb-3">Siga-nos nas<br>redes sociais</h5>

          <div class="social-icons">
            <a href="https://facebook.com" target="_blank" aria-label="Facebook"><i class="bi bi-facebook"></i></a>
            <a href="https://instagram.com" target="_blank" aria-label="Instagram"><i class="bi bi-instagram"></i></a>
            <a href="https://spotify.com" target="_blank" aria-label="Spotify"><i class="bi bi-spotify"></i></a>
            <a href="https://youtube.com" target="_blank" aria-label="YouTube"><i class="bi bi-youtube"></i></a>
          </div>
        </div>

      </div>
    </div>
  </section>

</body>
</html>
