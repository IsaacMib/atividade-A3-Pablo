<!-- Serviços Online Card -->
<div class="d-flex flex-wrap py-4">
    <div class="row g-4">
        {% for i in '12345678' %}
        <div class="col-12 col-sm-6 col-lg-4 col-xl-3">
            <div class="card h-100 border-0 shadow-sm">
                <div class="card-header bg-primary text-white d-flex align-items-center justify-content-between">
                    <span class="fw-bold">DETRAN - Habilitação</span>
                    <div class="d-flex gap-2">
                        <span class="d-flex align-items-center justify-content-center rounded-circle border border-white"
                              style="width: 28px; height: 28px;"
                              data-bs-toggle="tooltip" 
                              data-bs-placement="top" 
                              title="Presencial">
                            <i class="pi pi-user" style="font-size: 0.8rem;"></i>
                        </span>
                        <span class="d-flex align-items-center justify-content-center rounded-circle border border-white"
                              style="width: 28px; height: 28px;"
                              data-bs-toggle="tooltip" 
                              data-bs-placement="top" 
                              title="Serviço para tirar habilitação">
                            <i class="pi pi-question" style="font-size: 0.8rem;"></i>
                        </span>
                    </div>
                </div>
                <div class="card-body d-flex justify-content-center align-items-center">
                    <h5 class="card-title text-muted fw-semibold text-center mb-0">
                        Serviço para tirar habilitação
                    </h5>
                </div>
                <div class="card-footer bg-transparent border-top">
                    <button class="btn btn-outline-secondary w-100 rounded-pill" 
                            onclick="handleClick('123')">
                        Acessar
                    </button>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>

<!-- Initialize Bootstrap tooltips -->
<script>
    var tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
    var tooltipList = tooltipTriggerList.map(function (tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl);
    });
</script>
