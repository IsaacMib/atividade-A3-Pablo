<div class="container solucoes-wrapper">
    {% include 'include/titulo.html' with titulo=self.titulo bgClass='' %}
    <div class="swiper-container">
      <div class="swiper carrossel-solucoes">
        <div class="swiper-wrapper">
          {% for solucao in value.solucoes %}
            <div class="swiper-slide">
              {% include 'blocks/item_solucao.html' with value=solucao %}
            </div>
          {% endfor %}
        </div>  
        <!-- Paginação -->
        <div class="swiper-pagination swiper-solucoes-pagination"></div>
      </div>
      <!-- Botões de navegação -->
      <div class="swiper-button-prev swiper-solucoes-prev d-none d-md-block"></div>
      <div class="swiper-button-next swiper-solucoes-next d-none d-md-block"></div>
    </div>
    
    
  </div>
  
  <script>
  document.addEventListener('DOMContentLoaded', function() {
    const swiperSolucoes = new Swiper('.carrossel-solucoes', {
          slidesPerView: 3,
          spaceBetween: 20,
          pagination: {
              el: '.swiper-solucoes-pagination',
              clickable: true,
          },
          navigation: {
              nextEl: '.swiper-solucoes-next',
              prevEl: '.swiper-solucoes-prev',
          },
          loop: true,
          breakpoints: {
              0: { slidesPerView: 1 },
              640: { slidesPerView: 1 },
              768: { slidesPerView: 2 },
              1024: { slidesPerView: 3 }
          }
      });
  });
  </script>
