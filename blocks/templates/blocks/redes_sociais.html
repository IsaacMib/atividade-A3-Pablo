{% load static %}
{% load wagtailimages_tags %}

<section class="social-banner py-5">
  <div class="container">
    <div class="row justify-content-center text-center">

      <!-- Título -->
      <div class="col-12 mb-3">
        <h2 style="color: #1A3155;" class="social-title mb-4"><strong></strong>{{ self.titulo|linebreaksbr }}</strong>
        </h2>
      </div>

      <!-- Ícones -->
      <div class="col-12 mb-4">
        <div class="social-icons d-flex justify-content-center gap-3">
          {% for rede in self.redes %}
          <a href="{{ rede.link }}" target="_blank" aria-label="{{ rede.nome }}">
            <i class="{{ rede.icone }}"></i>
          </a>
          {% endfor %}
        </div>
      </div>

      <!-- Imagem -->
      {% if self.imagem %}
      <div class="col-12">
        {% image self.imagem original class="mx-auto d-block social-image" alt=self.imagem.title %}
      </div>
      {% endif %}

    </div>
  </div>
</section>
