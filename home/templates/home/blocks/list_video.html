{% load wagtailcore_tags %}

<div class="videos-container">
  {% for video in self.videos %}
    {% include_block video %}
  {% endfor %}
</div>

<!-- Link "Ver todos" configurável -->
{% if self.ver_todos_url %}
<div class="text-center">
  <a class="btn-ver-todos" href="{{ self.ver_todos_url }}" target="_blank">Ver todos</a>
</div>
{% endif %}
