{% load wagtailcore_tags %}

<div class="dica-bloco dica-bloco-mensagem">
    <div class="dica-bloco-header">
        <i class="bi bi-chat-dots"></i>
        <h3>Mensagem Pessoal</h3>
    </div>
    
    <div class="dica-bloco-content">
        {% if value.texto %}
            <div class="mensagem-texto">
                {{ value.texto|richtext }}
            </div>
        {% endif %}
        
        {% if value.assinatura %}
            <div class="mensagem-assinatura">
                <p><strong>{{ value.assinatura }}</strong></p>
            </div>
        {% endif %}
    </div>
</div>
