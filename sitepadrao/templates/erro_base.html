<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {%block title%}
    {%endblock%}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&display=swap" rel="stylesheet">
</head>
<body>
    <div id="container">
        {%block content%}
        {%endblock%}
    </div>
<style>

    #container{
        position: fixed;
        width: 100vw;
        height: 100vh;
        inset: 0;
        display: flex;
        background: linear-gradient(146.6deg, #09C6F9 0.99%, #045DE9 99.72%), rgba(252, 163, 17, 0.1);
        justify-content:space-around;
        align-items: center;
        padding: 1vh;
        box-sizing: border-box;
    }

    #info{
    font-family: 'Nunito Sans';
    font-style: normal;
    /* or 28px */
    color: #FFFFFF;
    }

    #info h1{
        font-size: clamp(4rem, 5vw, 8rem);
    }
    #info h3{
        font-size: clamp(3rem, 3.5vw, 4rem);
        margin-bottom: 15%;
    }

    #info button{
    background: #F7F7FD;
    box-shadow: 0px 4px 60px rgba(0, 0, 0, 0.05);
    border-radius: 10px;
    width:100%;
    cursor: pointer;
    font-family: 'Nunito Sans';
    font-weight: 900;
    font-size: 18px;
    line-height: 180%;
    color: #568ED8;
    }
    #info button:hover{
        background: #e6e6f1;
    }

    @media screen and (max-width: 810px) {
        #container {
            display: flex;
            flex-direction: column;
        }
        #info {
            text-align: center;
        }
    }
</style>
</body>
</html>
