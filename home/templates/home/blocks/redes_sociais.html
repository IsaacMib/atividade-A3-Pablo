{% load static %}
{% load wagtailimages_tags %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redes Sociais</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <!-- Seu CSS -->
  <link rel="stylesheet" href="{% static 'css/main.css' %}">
</head>
<body>

  <section class="social-banner">
    <div class="container">
      <div class="row align-items-center justify-content-center text-center text-md-start">

        {% if self.imagem %}
        <div class="col-12 col-md-6 mb-4 mb-md-0 text-center">
          {% image self.imagem original class="mx-auto social-image" alt=self.imagem.title %}
        </div>
        {% endif %}

        <div class="col-12 col-md-6 social-text">
          <h2 class="social-title mb-4">{{ self.titulo|linebreaksbr }}</h2>

          <div class="social-icons">
            {% for rede in self.redes %}
              <a href="{{ rede.link }}" target="_blank" aria-label="{{ rede.nome }}">
                <i class="{{ rede.icone }}"></i>
              </a>
            {% endfor %}
          </div>
        </div>

      </div>
    </div>
  </section>

</body>
</html>
