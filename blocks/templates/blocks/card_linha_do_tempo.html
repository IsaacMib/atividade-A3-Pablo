{% load wagtailimages_tags %}
<div class="linha-do-tempo__item" data-index="{{ index }}" data-last="{{ last_index }}">
    <div class="linha-do-tempo-item-row">
        <svg class="linha-do-tempo-calendar-group left"
            viewBox="0 0 64 64"
            width="64"
            height="64"
        >
            <circle class="calendar-circle"
                cx="32"
                cy="32"
                r="30"
            />
        </svg>
        <i class="bi-calendar3 linha-do-tempo-calendar-group calendar-icon left"
            {% comment %} data-percentage="{% if not position|divisibleby:2 %}{{ multiple|add:-2 }}{% else %}{{ multiple }}{% endif %}"
            style="--index: {{ index }};
            --percentageRange: {% if not position|divisibleby:2 %}{{ multiple|add:-2 }}{% else %}{{ multiple }}{% endif %};" {% endcomment %}
        ></i>
            <div class="arrow left animate"></div>
            <div class="card-linha-do-tempo animate">
                <div class="card-linha-do-tempo__image">
                    {% image card.imagem width-400 alt=card.texto_alternativo|default:card.titulo %}
                </div>
                <div class="card-linha-do-tempo__content text-center">
                    <h3 class="card-linha-do-tempo__title">
                        <a href="{% if card.internal_page %}{{ card.internal_page.url }}{% else %}{{ card.external_url }}{% endif %}">
                            {{ card.titulo }}
                        </a>
                    </h3>
                    {% comment %} <p class="card-linha-do-tempo__date">{{ card.data|date:"d/m/Y" }}</p> {% endcomment %}
                    <p class="card-linha-do-tempo__description">{{ card.descricao }}</p>
                </div>
            </div>
            <div class="arrow right animate"></div>
        <i class="bi-calendar3 linha-do-tempo-calendar-group calendar-icon right"
            {% comment %} data-percentage="{% if not position|divisibleby:2 %}{{ multiple|add:-2 }}{% else %}{{ multiple }}{% endif %}"
            style="--index: {{ index }};
            --percentageRange: {% if not position|divisibleby:2 %}{{ multiple|add:-2 }}{% else %}{{ multiple }}{% endif %};" {% endcomment %}
        ></i>
        <svg class="linha-do-tempo-calendar-group right"
            viewBox="0 0 64 64"
            width="64"
            height="64"
        >
            <circle class="calendar-circle"
                cx="32"
                cy="32"
                r="30"
            />
        </svg>
    </div>
    <script id="timeline-script-{{ index }}" class="timeline-script">

        (function() {
            const script = document.getElementById('timeline-script-{{ index }}');
            const item = script.closest('.linha-do-tempo__item');
            if (!item) return;

            const index = parseInt(item.dataset.index, 10);
            const last = parseInt(item.dataset.last, 10);

            // cálculo do índice dos card na linha do tempo pares avançam 1 enquanto ímpares avançam 2
            const isEven = index % 2 == 0;
            const segmentLength = isEven ? 1 : 2;

            const position = isEven ? 3*(index / 2) : 3*(((index - 1) / 2)) + 1;
            //const next = position + segmentLength;
            const final = last % 2 == 0 ? 3*(last / 2) : 3*(((last - 1) / 2)) + 1;

            const offSet = ((final - segmentLength) - position);

            const percentageStart = ((position / final) * 100) + offSet;
            // const percentageEnd = ((next / final) * 100) + offSet;
            const percentage = percentageStart;

            const percentageCorrectionFactor = segmentLength / final;

            const icons = item.querySelectorAll('.linha-do-tempo-calendar-group.calendar-icon');
            icons.forEach(icon => {
                // icon.setAttribute('data-percentage', `${percentage}%`);
                icon.style.setProperty('--index', index);
                icon.style.setProperty('--percentageRange', `${percentage}%`);
                icon.style.setProperty('--percentageCorrectionFactor', percentageCorrectionFactor);
            });

            const getRevealedPercentage = () => {
                const raw = getComputedStyle(document.documentElement).getPropertyValue('--reveal-percentage');
                return parseFloat(raw) || 0;
            }

            const svgs  = item.querySelectorAll('svg.linha-do-tempo-calendar-group');

            [...icons, ...svgs].forEach(el => {
                el.setAttribute('data-percentage', String(percentage)); // store as number string without %
            });

            const checkIcons = () => {
                const current = getRevealedPercentage();
                // Toggle class on icons and SVGs
                [...icons, ...svgs].forEach(el => {
                    const target = parseFloat(el.getAttribute('data-percentage')) || 0;
                    el.classList.toggle('reached-by-line', current >= target);
                });
            };

            window.addEventListener('load', checkIcons, { passive: true });
            window.addEventListener('scroll', checkIcons, { passive: true });
            window.addEventListener('resize', checkIcons, { passive: true });
        })();
    </script>
</div>
