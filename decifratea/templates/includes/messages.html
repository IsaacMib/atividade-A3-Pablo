{% load static %}

{% if messages %}
<div class="fixed top-4 right-4 z-50 space-y-2" x-data="{ show: true }" x-show="show" x-init="setTimeout(() => show = false, 5000)">
    {% for message in messages %}
    <div class="{% if message.tags %}alert-{{ message.tags }}{% endif %} bg-white border-l-4 p-4 rounded-lg shadow-lg max-w-md
        {% if message.tags == 'error' %}border-red-500{% endif %}
        {% if message.tags == 'warning' %}border-yellow-500{% endif %}
        {% if message.tags == 'success' %}border-green-500{% endif %}
        {% if message.tags == 'info' %}border-blue-500{% endif %}"
         role="alert">
        <div class="flex items-center justify-between">
            <p class="text-gray-800">{{ message }}</p>
            <button @click="show = false" class="ml-4 text-gray-500 hover:text-gray-700">
                <svg class="h-5 w-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
    </div>
    {% endfor %}
</div>
{% endif %}
