{% load wagtailcore_tags wagtailimages_tags static file_extras %}

<a class="d-block h-100 text-decoration-none text-reset" href="{% pageurl aviso %}">
  <div class="aviso-card card h-100 shadow-sm">
    <div class="card-body d-flex flex-column">
      <h3 class="aviso-title h5 mb-2">{{ aviso.title }}</h3>

      {% if aviso.descricao %}
        <p class="aviso-descricao mb-2 text-start">{{ aviso.descricao|striptags|truncatechars:120 }}</p>
      {% endif %}

      <div class="mt-auto d-flex justify-content-between align-items-center text-start">
        <div class="d-flex align-items-center">
          <i class="bi bi-calendar3 me-2"></i>
          {% if aviso.data_publicacao %}
            <small class="aviso-data fw-bold">{{ aviso.data_publicacao|date:"d/m/Y" }}</small>
          {% endif %}
        </div>
      </div>
    </div>
  </div>
</a>
