[pytest]
DJANGO_SETTINGS_MODULE = neuroathena.settings.testing
python_files = test_*.py *_test.py tests.py
python_classes = Test* *Tests
python_functions = test_*
testpaths = .
norecursedirs = .git .venv node_modules migrations static media docs

# Configurações de output
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --reuse-db
    --create-db
    --nomigrations
    -p no:warnings

# Marcadores personalizados
markers =
    slow: marca teste como lento (desseleciona com '-m "not slow"')
    integration: marca teste de integração
    unit: marca teste unitário
    wagtail: testes relacionados ao Wagtail CMS
    ia: testes relacionados a IA e análise multimodal
    lgpd: testes relacionados a conformidade LGPD

# Configurações de cobertura
[coverage:run]
source = .
omit = 
    */migrations/*
    */tests/*
    */test_*.py
    */__pycache__/*
    */node_modules/*
    .venv/*
    manage.py
    */settings/*
    */wsgi.py
    */asgi.py
    */apps.py
    conftest.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    def __str__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod

[coverage:html]
directory = htmlcov
