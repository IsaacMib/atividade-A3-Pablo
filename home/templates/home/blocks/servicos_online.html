<!-- Serviços Online Card -->
<div class="swiper swiperServicosOnline">
    <div class="swiper-wrapper">
        {% for i in '12345678' %}
        <div class="swiper-slide">
            <div class="card border-0 mx-auto" role="article" aria-label="Serviço de Habilitação DETRAN">
                <div class="card-header text-white d-flex align-items-center justify-content-between">
                    <span class="fw-bold card-header--title">DETRAN - Habilitação</span>
                    <div class="d-flex gap-2">
                        <span class="card-header--icon d-flex align-items-center justify-content-center rounded-circle border border-white"
                              data-bs-toggle="tooltip" 
                              data-bs-title="Presencial">
                            <i uk-icon="icon: user; ratio: 0.75" style="font-size: 0.6rem;"></i>
                        </span>
                        <span class="card-header--icon d-flex align-items-center justify-content-center rounded-circle border border-white fw-light"
                              data-bs-toggle="tooltip" 
                              data-bs-title="Esse serviço é destinado a motoristas que não conseguem realizar o agendamento online">
                            ?
                        </span>
                    </div>
                </div>
                <div class="card-body d-flex justify-content-center align-items-center">
                    <p class="card-title text-muted fw-semibold text-center mb-0 fs-4">
                        Serviço para tirar habilitação
                    </p>
                </div>
                <div class="card-footer border-top mx-auto">
                    <a class="btn btn-outline-secondary px-4 my-2 rounded-pill text-decoration-none" href="#" role="button" aria-label="Acessar serviço de habilitação">
                        Acessar
                    </a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>
    <div class="swiper-pagination"></div>
</div>

<script>

document.addEventListener('DOMContentLoaded', function() {
    const swiperServicosOnline = new Swiper('.swiperServicosOnline', {
        slidesPerView: 1,
        spaceBetween: 20,
        autoplay: {
            delay: 2500,
            disableOnInteraction: false,
            pauseOnMouseEnter: true
        },
        breakpoints: {
            1024: {
                slidesPerView: 2,
            },
            1440: {
                slidesPerView: 3,
                spaceBetween: 30,
            },
            1920: {
                slidesPerView: 4,
                spaceBetween: 40,
            },
        },
        navigation: {
            nextEl: '.swiper-button-next',
            prevEl: '.swiper-button-prev',
        },
        pagination: {
            el: '.swiper-pagination',
            clickable: true,
        },
        loop: true,
    });

    const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
    tooltipTriggerList.map(function(tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl);
    });
});
</script>
