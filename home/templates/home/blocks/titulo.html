<div class="titulo-container {% if self.bgAzul %}titulo-bg-azul{% endif %} text-center">
   <div class="d-flex flex-column align-items-center">
       <h1 class="titulo-1">{{self.titulo}}</h1>
       <div class="titulo-linha">
           <svg width="133" height="3">
               <line x1="0" y1="1.5" x2="133" y2="1.5" stroke="{% if self.bgAzul %}#ffffff{% else %}#305A9C{% endif %}" stroke-width="3"/>
           </svg>
       </div>
   </div>
</div>
