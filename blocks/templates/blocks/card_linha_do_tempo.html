{% load wagtailimages_tags %}
<div class="linha-do-tempo__item">
    <div class="linha-do-tempo-item-row">
        <svg class="linha-do-tempo-calendar-group left"
            viewBox="0 0 64 64"
            width="64"
            height="64"
        >
            <circle class="calendar-circle"
                cx="32"
                cy="32"
                r="30"
                fill="none"
            />
        </svg>
        <i class="bi-calendar3 linha-do-tempo-calendar-group calendar-icon left"
            style="--index: {{ index }};"
        ></i>
            <div class="arrow left animate"></div>
            <div class="card-linha-do-tempo animate">
                <div class="card-linha-do-tempo__image">
                    {% image card.imagem width-400 alt=card.texto_alternativo|default:card.titulo %}
                </div>
                <div class="card-linha-do-tempo__content text-center">
                    <h3 class="card-linha-do-tempo__title">
                        <a href="{% if card.internal_page %}{{ card.internal_page.url }}{% else %}{{ card.external_url }}{% endif %}">
                            {{ card.titulo }}
                        </a>
                    </h3>
                    {% comment %} <p class="card-linha-do-tempo__date">{{ card.data|date:"d/m/Y" }}</p> {% endcomment %}
                    <p class="card-linha-do-tempo__description">{{ card.descricao }}</p>
                </div>
            </div>
            <div class="arrow right animate"></div>
        <i class="bi-calendar3 linha-do-tempo-calendar-group calendar-icon right"
            style="--index: {{ index }};"
        ></i>
        <svg class="linha-do-tempo-calendar-group right"
            viewBox="0 0 64 64"
            width="64"
            height="64"
        >
            <circle class="calendar-circle"
                cx="32"
                cy="32"
                r="30"
                fill="none"
            />
        </svg>
    </div>
</div>
