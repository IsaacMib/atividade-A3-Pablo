{% load static %}

<section class="social-banner">
  <div class="container">
    <div class="row align-items-center justify-content-center text-center text-md-start">
      
      <div class="col-12 col-md-6 mb-4 mb-md-0 text-center">
        <img src="{% static 'img/mulher_redes_sociais.png' %}" alt="Redes sociais" class="mx-auto social-image" />
      </div>

      <div class="col-12 col-md-6 social-text">
        <h5 class="social-title mb-4">{{ self.titulo|linebreaksbr }}</h5>
        
        <div class="social-icons">
          {% for rede in self.redes %}
            <a href="{{ rede.link }}" target="_blank" aria-label="{{ rede.nome }}">
              <i class="{{ rede.icone }}"></i>
            </a>
          {% endfor %}
        </div>
      </div>

    </div>
  </div>
</section>
