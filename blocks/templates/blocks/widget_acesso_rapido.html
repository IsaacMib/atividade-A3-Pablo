{% comment %} Widget de Acessos Rápidos - separado para controle independente {% endcomment %}
<div class="widget-acesso-rapido">
  <ul class="list-unstyled d-flex flex-column gap-2 mb-0">
    {% for item in itens %}
      <li class="d-flex align-items-center gap-3">
        <a href="{{ item.link }}" class="d-flex align-items-center text-reset text-decoration-none w-100">
          <span class="icon rounded-circle d-inline-flex align-items-center justify-content-center" aria-hidden="true">
            {% if item.icone %}
              <i class="{{ item.icone }}"></i>
            {% else %}
              <i class="fa-regular fa-file-lines"></i>
            {% endif %}
          </span>
          <span class="title">{{ item.titulo }}</span>
        </a>
      </li>
    {% endfor %}
  </ul>
</div>
