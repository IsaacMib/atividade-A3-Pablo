<!-- Serviços Online Card -->
<div class="swiper swiperServicosOnline">
    <div class="swiper-wrapper col-9">
        {% for i in '12345678' %}
        <div class="swiper-slide">
            <div class="card border-0 shadow-sm">
                <div class="card-header bg-primary text-white d-flex align-items-center justify-content-between">
                    <span class="fw-bold">DETRAN - Habilitação</span>
                    <div class="d-flex gap-2">
                        <span class="d-flex align-items-center justify-content-center rounded-circle border border-white"
                              style="width: 28px; height: 28px;"
                              data-bs-toggle="tooltip" 
                              data-bs-title="Presencial">
                            <i uk-icon="icon: user; ratio: 0.75" style="font-size: 0.6rem;"></i>
                        </span>
                        <span class="d-flex align-items-center justify-content-center rounded-circle border border-white fw-light"
                              style="width: 28px; height: 28px;"
                              data-bs-toggle="tooltip" 
                              data-bs-title="Esse serviço é destinado a motoristas que não conseguem realizar o agendamento online">
                            ?
                        </span>
                    </div>
                </div>
                <div class="card-body d-flex justify-content-center align-items-center">
                    <h5 class="card-title text-muted fw-semibold text-center mb-0">
                        Serviço para tirar habilitação
                    </h5>
                </div>
                <div class="card-footer bg-transparent border-top">
                    <a class="btn btn-outline-secondary w-100 rounded-pill text-decoration-none" href="#">
                        Acessar
                    </a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    <div class="swiper-button-next"></div>
    <div class="swiper-button-prev"></div>
    <div class="swiper-pagination"></div>
</div>

<!-- Initialize Bootstrap tooltips -->
<script>
document.addEventListener('DOMContentLoaded', function() {
    const tooltipTriggerList = [].slice.call(document.querySelectorAll('[data-bs-toggle="tooltip"]'));
    tooltipTriggerList.map(function(tooltipTriggerEl) {
        return new bootstrap.Tooltip(tooltipTriggerEl);
    });
});
</script>
