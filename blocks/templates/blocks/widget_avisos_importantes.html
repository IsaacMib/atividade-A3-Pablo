{% comment %} Widget Avisos Importantes - puxa avisos da página de avisos e exibe como lista compacta {% endcomment %}
<div class="widget-avisos-importantes">
  <ul class="list-unstyled mb-0">
    {% for aviso in avisos %}
      <li class="d-flex align-items-center gap-3 mb-2">
        <a href="{{ aviso.get_url }}" class="d-flex align-items-center text-reset text-decoration-none w-100">
          <span class="icon rounded-circle d-inline-flex align-items-center justify-content-center" aria-hidden="true">
            <!-- ícone padrão ou específico -->
            <i class="fa-regular fa-bullhorn"></i>
          </span>
          <span class="title">{{ aviso.title }}</span>
        </a>
      </li>
    {% endfor %}
  </ul>
</div>
