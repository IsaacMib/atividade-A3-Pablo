{% load static %}
{% load wagtailimages_tags %}

<div class="container">
  <!-- Slider main container -->
  <div class="swiper carrossel-banners">
    <!-- Additional required wrapper -->
    <div class="swiper-wrapper">
      <!-- Slides dinâmicos -->
      {% for banner in value.banners %}
        <div class="swiper-slide">
          {% include 'blocks/item_carrossel_banner.html' with value=banner %}
        </div>
      {% endfor %}
    </div>
    <!-- If we need pagination -->
    <div class="swiper-pagination swiper-banners-pagination"></div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const swiperServicosOnline = new Swiper('.carrossel-banners', {
        slidesPerView: 1,
        spaceBetween: 20,
        pagination: {
            el: '.swiper-banners-pagination',
            clickable: true,
        },
        loop: true,
        {% if value.banners|length > 1 %}
          autoplay: {
            delay: 5000,
            disableOnInteraction: false,
          },
        {% endif %}
    });
});
</script>
